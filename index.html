<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker</title>
    <meta
      name="description"
      content="A colourful drag-and-drop job application tracker with a dashboard, follow-up reminders and private, in-browser storage."
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Job Tracker" />
    <meta property="og:description" content="Track every application on a drag-and-drop board, with reminders and insights." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var saved = JSON.parse(localStorage.getItem('jat.theme'))
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>This app needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
